{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<h2 style="margin-bottom:4px;">Welcome back</h2>
<p class="text-muted-drop" style="margin-bottom:26px;">Log in to keep teaching, or keep learning.</p>

<form method="POST">
  <div style="margin-bottom:16px;">
    <label class="form-label-drop">Email</label>
    <input class="form-control-drop" type="email" name="email" placeholder="you@school.com" required autofocus>
  </div>
  <div style="margin-bottom:10px;">
    <label class="form-label-drop">Password</label>
    <input class="form-control-drop" type="password" name="password" placeholder="••••••••" required>
  </div>
  <div style="text-align:right; margin-bottom:22px;">
    <a href="{{ url_for('forgot_password') }}" style="font-size:13px;">Forgot password?</a>
  </div>
  <button class="btn-drop-primary" type="submit" style="width:100%; justify-content:center;">Log in</button>
</form>

<p style="text-align:center; margin-top:22px; font-size:14px;" class="text-muted-drop">
  New to DROP? <a href="{{ url_for('signup') }}">Create an account</a>
</p>
{% endblock %}
