{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth_content %}
<h2 style="margin-bottom:4px;">Reset your password</h2>
<p class="text-muted-drop" style="margin-bottom:26px;">Enter your email and we'll send a reset link.</p>

<form method="POST">
  <div style="margin-bottom:22px;">
    <label class="form-label-drop">Email</label>
    <input class="form-control-drop" type="email" name="email" placeholder="you@school.com" required autofocus>
  </div>
  <button class="btn-drop-primary" type="submit" style="width:100%; justify-content:center;">Send reset link</button>
</form>

<p style="text-align:center; margin-top:22px; font-size:14px;" class="text-muted-drop">
  <a href="{{ url_for('login') }}">← Back to log in</a>
</p>
{% endblock %}
