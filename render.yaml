services:
  - type: web
    name: drop
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # ONE worker on purpose: ai_engine.py allows one AI request at a time using an
    # in-process lock, so extra workers would multiply requests and hit the free-tier
    # rate limits. Threads still let several users browse at once. The long timeout is
    # for AI generation (course/lesson/test writing can take over 2 minutes).
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --access-logfile -
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: IS_PRODUCTION
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      # --- AI: Groq (primary) ---
      - key: GROQ_API_KEY
        sync: false            # paste your key in the Render dashboard
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # --- AI: OpenRouter (automatic fallback) ---
      - key: OPENROUTER_API_KEY
        sync: false            # optional but recommended
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: openrouter/free
      # Demo content if no AI key works, so the app never shows a dead end.
      - key: AI_MOCK_FALLBACK
        value: "1"

databases:
  - name: drop-db
    plan: free